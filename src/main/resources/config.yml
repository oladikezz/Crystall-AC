# ==============================================================================
#                      CRYSTALL ANTI-CHEAT (Paper/Spigot)
#       Zero-Dataset Heuristic Core + Real-Time Unsupervised Statistical Layer
# ==============================================================================

settings:
  prefix: "&b&lCrystallAC &8» &f"
  debug: false
  log_to_file: true
  log_to_database: true
  lag_compensation:
    max_ping_threshold: 400 # Ping in ms above which strict checks become lenient
    min_server_tps: 18.0   # TPS below which movement checks enter lenient mode
    exemption_ticks_after_teleport: 20
    exemption_ticks_after_respawn: 40
    exemption_ticks_after_knockback: 15

# ==============================================================================
#                           HEURISTIC CORE CHECKS
# ==============================================================================
checks:
  killaura:
    enabled: true
    max_vl: 100
    decay_amount: 1.0
    # Checks for instantaneous angle snaps directly onto unseen targets
    angle_snap_threshold: 38.5
    # Max allowed target switches in a single tick
    max_targets_per_tick: 1
    # Check for hits without proper camera rotation prior to swing
    require_rotation_on_swing: true

  reach:
    enabled: true
    max_vl: 100
    decay_amount: 1.0
    # Maximum base reach in survival mode (vanilla standard is 3.0 blocks)
    base_max_reach: 3.05
    # Dynamic expansion for ping / latency compensation
    ping_compensation_multiplier: 0.0035
    # Hitbox bounding box boundary expansion margin
    hitbox_expansion: 0.1

  speed:
    enabled: true
    max_vl: 100
    decay_amount: 1.0
    # Base walking/sprinting speeds (blocks/tick)
    base_walk_speed: 0.286
    base_sprint_speed: 0.362
    base_sprint_jump_speed: 0.612
    # Speed potion bonus multiplier per level (vanilla = +20%)
    speed_potion_multiplier: 0.20
    # Friction allowances
    ice_speed_multiplier: 1.45
    soul_sand_modifier: 0.40

  fly:
    enabled: true
    max_vl: 100
    decay_amount: 1.0
    # Max allowed continuous upward motion without jump/ladder/climbable
    max_upward_acceleration: 0.42
    # Gravity constant verification (vanilla deltaY gravity ~ 0.08)
    verify_gravity: true
    # Detection of client spoofing on-ground status in packets
    ground_spoof_detection: true

  autoclicker:
    enabled: true
    max_vl: 100
    decay_amount: 0.8
    # Absolute maximum allowable CPS
    max_cps: 18
    # Minimum standard deviation in ms for high CPS (human jitter threshold)
    min_deviation_ms: 4.8
    # Sample window size (clicks)
    sample_window: 20

  aimbot:
    enabled: true
    max_vl: 100
    decay_amount: 1.0
    # GCD (Greatest Common Divisor) sensitivity check
    check_gcd_sensitivity: true
    # Detection of rigid lock-on without human micro-corrections
    min_rotation_smoothness: 0.08
    # Max sudden yaw acceleration (degrees/tick)
    max_yaw_acceleration: 45.0

  timer:
    enabled: true
    max_vl: 100
    decay_amount: 1.5
    # Allowed packet balance drift in milliseconds (positive or negative)
    max_balance_drift_ms: 50.0
    # Sample period in server ticks
    sample_ticks: 20

# ==============================================================================
#              UNSUPERVISED STATISTICAL ANOMALY DETECTION LAYER
# ==============================================================================
# Builds rolling baseline statistics (EWMA, Z-Score) for each player in real-time.
# Requires NO pre-existing dataset or offline model training.
statistical_layer:
  enabled: true
  # Exponential smoothing factor (alpha) for EWMA (0.0 < alpha <= 1.0)
  ewma_alpha: 0.15
  # Z-Score outlier threshold (|Z| > 3.2 indicates ~99.9% statistical anomaly)
  zscore_threshold: 3.2
  # Window size for player baseline metrics
  metrics_window_size: 100
  # VL multiplier applied to heuristic flags when player is statistically anomalous
  anomaly_vl_multiplier: 1.5
  # Enable global baseline synchronization across all active server players
  sync_global_baseline: true

# ==============================================================================
#            INCREMENTAL RETRAINING MODULE (CONFIRMED BANS)
# ==============================================================================
# Collects 1-5 min feature buffers from players banned by moderators via /ac ban.
# When enough samples are gathered, fine-tunes heuristic thresholds.
# DISABLED by default until minimum sample count is reached.
incremental_ml:
  enabled: false # Set true once you wish auto-tuning to engage after gathering samples
  # Minimum labeled bans required before activating model fine-tuning
  min_samples_to_retrain: 25
  # Duration of historical feature buffer to save on manual ban (in seconds)
  feature_buffer_duration_seconds: 300
  # Maximum percentage adjustment to heuristic thresholds (safety cap: 15%)
  max_threshold_adjustment_percent: 0.15
  # Auto-tune learning rate
  learning_rate: 0.01

# ==============================================================================
#                         PUNISHMENT SYSTEM (LADDER)
# ==============================================================================
# Multi-tier response ladder based on accumulated Violation Level (VL)
punishments:
  decay_interval_seconds: 2
  
  tier_1_warn:
    vl_threshold: 10
    staff_alert: true
    message_player: false
    player_message: "&c[!] Your actions appear unstable. Please check your connection."

  tier_2_kick:
    vl_threshold: 25
    enabled: true
    kick_message: "&c[CrystallAC] Disconnected due to suspected unfair gameplay (VL: %vl%)."

  tier_3_shadow_ban:
    vl_threshold: 45
    enabled: true
    # Duration of shadow ban in minutes (0 for permanent until restart/unban)
    duration_minutes: 10
    # Shadow-banned players have their attacks cancelled and are hidden from normal players
    cancel_outgoing_damage: true
    hide_from_tab_and_world: true

  tier_4_ban:
    vl_threshold: 70
    enabled: true
    # Command executed by console on ban
    ban_command: "ban %player% [CrystallAC] Unfair Advantage detected: %check% (VL: %vl%)"
